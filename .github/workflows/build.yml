# GitHub Actions build for the SAM 3.1 RunPod worker image.
#
# Lives in the public `sam-card-worker` mirror repo as .github/workflows/build.yml
# (publish_worker.sh copies it there). Builds linux/amd64 on a hosted runner and
# pushes to GHCR with the job's own GITHUB_TOKEN — no extra secrets. The package
# inherits the repo's visibility, which is why the mirror repo is public: RunPod
# pulls the image anonymously.
name: build-worker
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (CUDA base is ~8 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sam_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
